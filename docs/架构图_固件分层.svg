<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" width="1360" height="1120">
<title>电烙铁固件分层架构</title>
<desc>五层架构：应用调度层、交互层、控制层、驱动层、硬件层，底部标注闭环路径与安全联锁横切关注点。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="40" y="24" width="600" height="76" rx="12" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="52" y="40" font-size="12" fill="#5F5E5A" dominant-baseline="central">应用调度层</text>
<rect x="52" y="50" width="132" height="40" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="118" y="66" font-size="12.5" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">main.c</text>
<text x="118" y="80" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">上电初始化</text>
<rect x="200" y="50" width="132" height="40" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="266" y="66" font-size="12.5" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">work_task</text>
<text x="266" y="80" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">200ms 闭环</text>
<rect x="348" y="50" width="132" height="40" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="414" y="66" font-size="12.5" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">input</text>
<text x="414" y="80" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">事件队列</text>
<rect x="496" y="50" width="132" height="40" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="562" y="66" font-size="12.5" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">ui_task</text>
<text x="562" y="80" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">渲染调度</text>

<path d="M266 102L266 116" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M414 102L414 116" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

<rect x="40" y="118" width="600" height="76" rx="12" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="52" y="134" font-size="12" fill="#5F5E5A" dominant-baseline="central">交互层</text>
<rect x="52" y="144" width="280" height="40" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="192" y="160" font-size="12.5" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">menu</text>
<text x="192" y="174" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">内核 · 菜单表 · 列表渲染</text>
<rect x="348" y="144" width="280" height="40" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="488" y="160" font-size="12.5" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">page</text>
<text x="488" y="174" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">12 个页面 · param 模板</text>

<path d="M266 196L266 210" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M488 196L488 210" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

<rect x="40" y="212" width="600" height="76" rx="12" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="52" y="228" font-size="12" fill="#5F5E5A" dominant-baseline="central">控制层</text>
<rect x="52" y="238" width="280" height="40" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="192" y="254" font-size="12.5" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">pid_controller</text>
<text x="192" y="268" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">PID + 前馈，取两者最大值</text>
<rect x="348" y="238" width="280" height="40" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="488" y="254" font-size="12.5" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">heater</text>
<text x="488" y="268" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">功率 0~100%，带使能门</text>

<path d="M192 290L192 304" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M488 290L488 304" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

<rect x="40" y="306" width="600" height="76" rx="12" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="52" y="322" font-size="12" fill="#5F5E5A" dominant-baseline="central">驱动层 bsp</text>
<rect x="52" y="332" width="108" height="40" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="106" y="348" font-size="12.5" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">adc</text>
<text x="106" y="362" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">温度 · 电流</text>
<rect x="169" y="332" width="108" height="40" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="223" y="348" font-size="12.5" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">pwm</text>
<text x="223" y="362" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">加热占空比</text>
<rect x="286" y="332" width="108" height="40" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="340" y="348" font-size="12.5" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">oled</text>
<text x="340" y="362" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">8x16 字模</text>
<rect x="403" y="332" width="108" height="40" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="457" y="348" font-size="12.5" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">key</text>
<text x="457" y="362" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">encoder 去抖</text>
<rect x="520" y="332" width="108" height="40" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="574" y="348" font-size="12.5" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">flash</text>
<text x="574" y="362" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">config 三页</text>

<path d="M106 384L106 398" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M223 384L223 398" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M340 384L340 398" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M457 384L457 398" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M574 384L574 398" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

<rect x="40" y="400" width="600" height="76" rx="12" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="52" y="416" font-size="12" fill="#5F5E5A" dominant-baseline="central">硬件层</text>
<rect x="52" y="426" width="132" height="40" rx="8" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
<text x="118" y="442" font-size="12" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">热电偶 + 加热管</text>
<text x="118" y="456" font-size="11" fill="#854F0B" text-anchor="middle" dominant-baseline="central">模拟前端</text>
<rect x="200" y="426" width="132" height="40" rx="8" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
<text x="266" y="442" font-size="12" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">OLED 128x64</text>
<text x="266" y="456" font-size="11" fill="#854F0B" text-anchor="middle" dominant-baseline="central">SPI 屏</text>
<rect x="348" y="426" width="132" height="40" rx="8" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
<text x="414" y="442" font-size="12" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">旋钮 + 按键</text>
<text x="414" y="456" font-size="11" fill="#854F0B" text-anchor="middle" dominant-baseline="central">GPIO 上拉</text>
<rect x="496" y="426" width="132" height="40" rx="8" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
<text x="562" y="442" font-size="12" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">Flash 256KB</text>
<text x="562" y="456" font-size="11" fill="#854F0B" text-anchor="middle" dominant-baseline="central">页 2KB</text>

<rect x="40" y="492" width="600" height="48" rx="8" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="54" y="510" font-size="11.5" fill="#444441" dominant-baseline="central">闭环：adc 实测温度 → work_task → pid_controller → pwm → 加热管 → 热电偶</text>
<text x="54" y="528" font-size="11.5" fill="#444441" dominant-baseline="central">横切：安全联锁（过温 · 热电偶开路 · 过流 · IWDG）· CRC · TYPECAL / CAL / CONFIG</text>
</svg>
