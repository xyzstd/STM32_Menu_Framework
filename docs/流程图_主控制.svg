<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 790" width="1360" height="1580">
<title>电烙铁主控制流程图</title>
<desc>WorkTask_Process 每 200ms 节拍的决策顺序，含六道提前返回出口与自检四步说明。</desc>
<defs>
<marker id="fa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="60" y="28" width="210" height="36" rx="18" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="165" y="46" font-size="12.5" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">上电 · WorkTask_Init</text>
<path d="M165 64L165 84" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#fa)"/>

<rect x="60" y="86" width="210" height="40" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="165" y="99" font-size="12" fill="#0C447C" text-anchor="middle" dominant-baseline="central">每轮：运动检测</text>
<text x="165" y="114" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">休眠 / 关机计时</text>
<path d="M165 126L165 146" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#fa)"/>

<polygon points="165,148 280,174 165,200 50,174" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
<text x="165" y="174" font-size="12" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">已过 200ms？</text>
<path d="M280 174L328 174" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#fa)"/>
<rect x="330" y="157" width="290" height="34" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="344" y="174" font-size="11.5" fill="#444441" dominant-baseline="central">否 — 返回，等下一轮</text>
<path d="M165 200L165 220" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#fa)"/>

<rect x="60" y="222" width="210" height="40" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="165" y="235" font-size="12" fill="#0C447C" text-anchor="middle" dominant-baseline="central">读输入电压</text>
<text x="165" y="250" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">冷端基准延后采样</text>
<path d="M165 262L165 282" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#fa)"/>

<polygon points="165,284 280,310 165,336 50,310" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
<text x="165" y="310" font-size="12" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">测量脉冲中？</text>
<path d="M280 310L328 310" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#fa)"/>
<rect x="330" y="293" width="290" height="34" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="344" y="310" font-size="11.5" fill="#444441" dominant-baseline="central">是 — 脉冲独占加热器，返回</text>
<path d="M165 336L165 356" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#fa)"/>

<polygon points="165,358 280,384 165,410 50,384" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
<text x="165" y="384" font-size="12" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">SHUTDOWN？</text>
<path d="M280 384L328 384" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#fa)"/>
<rect x="330" y="367" width="290" height="34" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="344" y="384" font-size="11.5" fill="#A32D2D" dominant-baseline="central">是 — 断热，返回</text>
<path d="M165 410L165 430" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#fa)"/>

<polygon points="165,432 280,458 165,484 50,458" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
<text x="165" y="458" font-size="12" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">自检已完成？</text>
<path d="M280 458L328 458" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#fa)"/>
<rect x="330" y="441" width="290" height="34" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="344" y="458" font-size="11.5" fill="#A32D2D" dominant-baseline="central">否 — 推进一步自检，返回</text>
<path d="M165 484L165 504" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#fa)"/>

<polygon points="165,506 280,532 165,558 50,532" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
<text x="165" y="532" font-size="12" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">存在锁存故障？</text>
<path d="M280 532L328 532" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#fa)"/>
<rect x="330" y="515" width="290" height="34" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="344" y="532" font-size="11.5" fill="#A32D2D" dominant-baseline="central">是 — 断热，等长按恢复</text>
<path d="M165 558L165 578" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#fa)"/>

<polygon points="165,580 280,606 165,632 50,606" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
<text x="165" y="606" font-size="12" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">校准数据有效？</text>
<path d="M280 606L328 606" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#fa)"/>
<rect x="330" y="589" width="290" height="34" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="344" y="606" font-size="11.5" fill="#A32D2D" dominant-baseline="central">否 — 断热 + PID 复位</text>
<path d="M165 632L165 652" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#fa)"/>

<rect x="60" y="654" width="210" height="48" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="165" y="669" font-size="12.5" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">run_pid_cycle</text>
<text x="165" y="687" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">采样 → PID+前馈 → PWM → 诊断</text>

<rect x="40" y="722" width="600" height="48" rx="8" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="54" y="740" font-size="11.5" fill="#444441" dominant-baseline="central">自检四步：热电偶区间 → 施加测量脉冲 → 读电流判断芯 → 输入电压范围</text>
<text x="54" y="758" font-size="11.5" fill="#444441" dominant-baseline="central">故障恢复：HOME 长按 → WorkTask_Recover（过温直清，链路类重跑自检）</text>
</svg>
